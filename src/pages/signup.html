<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Kōhi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50">

  <nav class="flex items-center justify-between px-6 py-4 bg-amber-800 text-white">
    <span class="text-xl font-bold">☕ Kōhi</span>
    <div class="flex gap-6">
      <a href="../../index.html" class="hover:text-amber-200">Home</a>
      <a href="about.html" class="hover:text-amber-200">About</a>
      <a href="contact.html" class="hover:text-amber-200">Contact</a>
    </div>
    <div class="flex gap-4">
      <a href="signup.html" class="hover:text-amber-200">Sign Up</a>
      <a href="signin.html" class="hover:text-amber-200">Sign In</a>
    </div>
  </nav>

  <!-- Page Heading Banner -->
  <section class="py-12 px-6 text-center">
    <h1 class="text-4xl font-extrabold text-amber-900 mb-2">Create Your Account</h1>
    <p class="text-gray-600">Join Kōhi and never miss an offer.</p>
  </section>

  <!-- Signup Card -->
  <section class="flex justify-center px-6 pb-16">
    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

      <!-- Avatar Component -->
      <div class="flex justify-center mb-6">
        <img src="https://images.unsplash.com/photo-1740252117044-2af197eea287?w=200&q=80"
          class="rounded-full w-20 h-20 object-cover">
      </div>

      <form class="space-y-4">

        <!-- Input Component -->
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-900">Full Name</label>
          <input type="text" required placeholder="Your full name"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
        </div>

        <!-- Input Component -->
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-900">Email</label>
          <input type="email" required placeholder="you@example.com"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
        </div>

        <!-- Input Component -->
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-900">Password</label>
          <input type="password" required placeholder="Create a password"
            class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg w-full p-2.5">
        </div>

        <!-- Checkbox Component -->
        <div class="flex items-center gap-2">
          <input type="checkbox" required class="rounded border-gray-300">
          <label class="text-sm text-gray-600">I agree to the Terms & Conditions</label>
        </div>

        <!-- Button Component -->
        <button type="submit"
          class="w-full bg-amber-800 text-white font-semibold py-2.5 rounded-lg hover:bg-amber-700">
          Sign Up
        </button>

      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Already have an account?
        <a href="signin.html" class="text-amber-800 font-semibold hover:underline">Sign in</a>
      </p>

    </div>
  </section>

  <footer class="bg-amber-900 text-white text-center py-6">
    <p>&copy; 2026 Kōhi. All Rights Reserved.</p>
  </footer>

</body>
</html>
